name: Release

# Pushing a version tag (`git tag v0.2.0 && git push origin v0.2.0`) checks the
# tag against package.json and pocket.json, runs build.yml on the tagged
# commit, and creates a draft GitHub Release holding iPoDS-<tag>.3dsx,
# iPoDS-<tag>.cia and their SHA-256 sums. Install the draft's build on a
# console or in Azahar before publishing it. A tag with a SemVer prerelease
# (v0.2.0-beta.1) is marked as a prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check the tag against the declared version
        run: bun scripts/release-check.ts "$GITHUB_REF_NAME"

  build:
    needs: verify
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ipo-ds-3ds
          path: build

      # A re-run replaces the assets of a draft it created earlier; it never
      # touches a release that has been published.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp build/ipo-ds-main.3dsx "release/iPoDS-$TAG.3dsx"
          cp build/ipo-ds-main.cia "release/iPoDS-$TAG.cia"
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "$TAG is already published; delete the tag or release a new version" >&2
              exit 1
            fi
            gh release upload "$TAG" release/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" release/* --draft --verify-tag --generate-notes \
              --title "iPoDS $TAG" $prerelease
          fi
